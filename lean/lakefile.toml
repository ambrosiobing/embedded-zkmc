# zkmc: the Lean 4 development for the embedded-zkmc volume, chapter 14.
#
# Builds. `lake build` passes on a clean checkout in GitHub Actions, pinned to
# leanprover/lean4:v4.35.0. See STATUS.md for what that does and does not establish.
#
# There is no Mathlib dependency on purpose: every tactic used in ZKMC/ is in core
# Lean 4 (intro, induction, cases, refine, exact, rw, unfold, show, omega). See
# README.md, section "Why there is no Mathlib dependency".

name = "zkmc"
defaultTargets = ["ZKMC"]

[[lean_lib]]
name = "ZKMC"
