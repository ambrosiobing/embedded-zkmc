# Build the Lean development, and publish the result whatever it is.
#
# This workflow is EXPECTED TO FAIL until the development compiles for the first time. That is
# deliberate and it is explained in lean/STATUS.md. Lean 4 is installed on neither machine this
# volume is written on, so the kernel in this runner is the first one to read the development.
# A red run here is a measurement: the error count is public, and it falls as the work is done.
#
# It is a separate workflow from checks.yml on purpose. checks.yml guards what is published and
# must stay green; this one reports on something that is openly unfinished. Do not merge them,
# and do not make this one pass by weakening what it runs.
#
# No backslash escape appears in any script below. Two earlier versions were written through a
# shell heredoc, which ate the escapes: a printf newline became a real line break that broke the
# YAML indentation, and a grep word boundary became a literal backspace, which is the character
# the parser rejected on run 2. Shell here-documents are used instead, and the word boundary is
# spelled as a character class.

name: lean

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record what is being built
        run: |
          echo "toolchain pin:"
          cat lean/lean-toolchain
          echo
          echo "files and line counts:"
          find lean -name '*.lean' -print0 | xargs -0 wc -l

      - name: Prove the guards can fail, then run them
        run: |
          PATTERN='^[[:space:]]*(sorry|admit|sorryAx|native_decide)([^A-Za-z0-9_]|$)'

          # A check that cannot fail is not a check. Both patterns run against a planted
          # positive first, so that an empty result below is evidence rather than an accident.
          mkdir -p /tmp/probe
          cat > /tmp/probe/probe.lean <<'PROBE_LEAN'
          theorem t : True := by
            sorry
          PROBE_LEAN
          cat > /tmp/probe/probe.toml <<'PROBE_TOML'
          # this comment mentions mathlib and must NOT trigger the test
          [[require]]
          name = "mathlib"
          PROBE_TOML

          grep -qE "$PATTERN" /tmp/probe/probe.lean \
            || { echo "self-test failed: the placeholder pattern no longer matches a sorry"; exit 1; }
          grep -v '^[[:space:]]*#' /tmp/probe/probe.toml | grep -iq 'mathlib' \
            || { echo "self-test failed: the Mathlib pattern no longer matches a real require"; exit 1; }
          echo "self-tests passed: both patterns detect a planted positive"

          # Now the real checks. The development claims no placeholder in any proof position
          # and no Mathlib dependency, and both are cheap to verify, so neither is left to a
          # reader's trust.
          bad=$(grep -rnE "$PATTERN" lean --include='*.lean' || true)
          if [ -n "$bad" ]; then
            echo "A proof position uses a placeholder:"
            echo "$bad"
            exit 1
          fi

          # Comment lines are stripped before looking for Mathlib. The first version of this
          # step did not strip them and failed on run 1 against the lakefile's own sentence
          # saying there is no Mathlib dependency: a guard must not match its own prose.
          if grep -v '^[[:space:]]*#' lean/lakefile.toml | grep -iq 'mathlib'; then
            echo "lakefile declares a Mathlib dependency, which STATUS.md says it does not"
            exit 1
          fi
          echo "no placeholder in any proof position; no Mathlib dependency declared"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versions
        working-directory: lean
        run: |
          elan --version
          lean --version
          lake --version

      - name: lake build
        working-directory: lean
        run: lake build
